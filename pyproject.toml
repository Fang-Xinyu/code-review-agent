[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-review-agent"
version = "0.1.0"
description = "Evidence-grounded Python code review agent"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.7,<3",
  "langgraph>=0.2,<2",
  "langchain-openai>=0.2,<2",
  "streamlit>=1.36,<2",
  "ruff>=0.6,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["review_agent*"]
